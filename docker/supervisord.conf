# supervisord.conf - Process manager for all-in-one container
# Fallback config (entrypoint.sh handles actual orchestration)

[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[program:mysqld]
command=/usr/sbin/mariadbd --user=mysql --datadir=/var/lib/mysql
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/mysqld.log
stderr_logfile=/var/log/supervisor/mysqld_err.log
priority=10

[program:memcached]
command=/usr/bin/memcached -u memcache -p 11211 -l 0.0.0.0 -m 64
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/memcached.log
stderr_logfile=/var/log/supervisor/memcached_err.log
priority=20

[program:rms]
directory=/app/rms
command=npm run start
environment=NODE_ENV="production"
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/rms.log
stderr_logfile=/var/log/supervisor/rms_err.log
priority=30

[program:openclaw]
command=openclaw gateway start --port 18789 --bind 0.0.0.0
environment=OPENCLAW_HOME="/app/openclaw"
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/openclaw.log
stderr_logfile=/var/log/supervisor/openclaw_err.log
priority=40
