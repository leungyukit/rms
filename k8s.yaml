# k8s.yaml - Kubernetes deployment for RMS + OpenClaw All-in-One
# 使用方法：
#   kubectl apply -f k8s.yaml
#
# 或创建命名空间后部署：
#   kubectl create namespace rms
#   kubectl apply -f k8s.yaml -n rms

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rms-mysql-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: standard

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rms-uploads-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: standard

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openclaw-data-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: standard

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rms-openclaw
  labels:
    app: rms-openclaw
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rms-openclaw
  template:
    metadata:
      labels:
        app: rms-openclaw
    spec:
      containers:
        - name: rms-allinone
          image: rms-openclaw:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3800
              name: rms-web
            - containerPort: 18789
              name: openclaw-gw
            - containerPort: 3306
              name: mysql
            - containerPort: 11211
              name: memcached
          env:
            - name: MYSQL_USER
              value: "rms"
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rms-secrets
                  key: mysql-password
            - name: MYSQL_DATABASE
              value: "rms"
            # JWT 签名密钥（2026-08-03 新增）：应用启动时强校验，未设或 <32 位在
            # NODE_ENV=production 下直接拒绝启动。必须先创建 secret，见文件末尾说明。
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: rms-secrets
                  key: jwt-secret
            - name: OPENCLAW_ENABLED
              value: "true"
            - name: FEISHU_APP_ID
              valueFrom:
                secretKeyRef:
                  name: rms-secrets
                  key: feishu-app-id
            - name: FEISHU_APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: rms-secrets
                  key: feishu-app-secret
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
            - name: rms-uploads
              mountPath: /app/rms/public/uploads
            - name: openclaw-data
              mountPath: /app/openclaw
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
          livenessProbe:
            httpGet:
              path: /login
              port: 3800
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /login
              port: 3800
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: rms-mysql-pvc
        - name: rms-uploads
          persistentVolumeClaim:
            claimName: rms-uploads-pvc
        - name: openclaw-data
          persistentVolumeClaim:
            claimName: openclaw-data-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: rms-openclaw-service
spec:
  type: NodePort
  selector:
    app: rms-openclaw
  ports:
    - name: rms-web
      port: 3800
      targetPort: 3800
      nodePort: 30800
    - name: openclaw-gw
      port: 18789
      targetPort: 18789
      nodePort: 31878
    - name: mysql
      port: 3306
      targetPort: 3306
      nodePort: 30306
    - name: memcached
      port: 11211
      targetPort: 11211
      nodePort: 31211

---
# Secret（2026-08-03 修复）
#
# 原来这里用 stringData 明文写死 mysql-password: "rms123456" 并提交进 git ——
# 等于生产数据库密码全仓库公开。现改为不含任何真实值的模板：
# 部署前请在集群里自行创建/覆盖该 secret，不要把真实值写回本文件。
#
#   kubectl create secret generic rms-secrets \
#     --from-literal=mysql-password="$(openssl rand -base64 24)" \
#     --from-literal=jwt-secret="$(openssl rand -hex 32)" \
#     --from-literal=feishu-app-id=your_app_id \
#     --from-literal=feishu-app-secret=your_app_secret \
#     -n rms
#
# 已存在时更新（例如轮换 jwt-secret，注意会使所有登录态失效）：
#   kubectl create secret generic rms-secrets ... --dry-run=client -o yaml | kubectl apply -f -
#
# 注意：jwt-secret 必须 >= 32 位，否则应用在生产模式下拒绝启动。
# 若下面这段被 apply，缺失的键会导致 Pod 卡在 CreateContainerConfigError —— 属预期行为，
# 提醒你先把真实 secret 建好，而不是静默用弱默认值上线。
apiVersion: v1
kind: Secret
metadata:
  name: rms-secrets
  annotations:
    rms.io/managed-externally: "true"
    rms.io/note: "Do NOT commit real values here. Create via kubectl create secret."
type: Opaque
# 故意留空：由 kubectl create secret 提供真实值。
# 若你确实要用本文件管理，请改用 sealed-secrets / SOPS / External Secrets，别写明文。
stringData: {}
