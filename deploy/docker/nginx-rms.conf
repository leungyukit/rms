# nginx 反向代理 → RMS (Next.js)
# 走 docker 内网服务名 rms:3800，不绕公网

upstream rms_backend {
    # rms 是 compose 里的服务名，docker 内置 DNS 解析
    server rms:3800;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # RMS 有文件上传功能，默认 1M 太小
    client_max_body_size 100m;
    client_body_timeout 120s;

    # 日志
    access_log /var/log/nginx/rms-access.log;
    error_log  /var/log/nginx/rms-error.log warn;

    # 隐藏版本号
    server_tokens off;

    # gzip（Next.js 的 JS/CSS 收益明显）
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json
               application/javascript application/x-javascript
               text/javascript application/xml image/svg+xml;

    # Next.js 静态产物：带 hash 文件名，可长期缓存
    location /_next/static/ {
        proxy_pass http://rms_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://rms_backend;
        proxy_http_version 1.1;

        # 转发真实来源信息 —— RMS 判断协议/来源 IP 靠这些头
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # WebSocket / SSE 升级（Next.js 部分能力依赖）
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # 长连接超时：RMS 有导出类长请求，别过早掐断
        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # SSE 场景不缓冲，否则消息卡住
        proxy_buffering off;
        proxy_redirect off;
    }
}
